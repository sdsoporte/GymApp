services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymapp
      POSTGRES_PASSWORD: gymapp
      POSTGRES_DB: gymapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapp -d gymapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      ASSETS_URL: ${ASSETS_URL:-http://localhost:5174/exercises}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: 3001
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  assets:
    build:
      context: ./assets
      dockerfile: Dockerfile
    volumes:
      - ./assets/exercises:/usr/share/nginx/html/exercises:ro
    ports:
      - "5174:80"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"

  backup:
    image: postgres:16-alpine
    container_name: gymapp-backup
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      BACKUP_DAYS: "7"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "while true; do /backup.sh; sleep 86400; done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

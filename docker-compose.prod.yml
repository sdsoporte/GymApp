services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-gymapp.elautomata.com/trpc}
        VITE_ASSETS_URL: ${VITE_ASSETS_URL:-https://assets-gymapp.elautomata.com/exercises}
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gymapp-web.rule=Host(`gymapp.elautomata.com`)"
      - "traefik.http.routers.gymapp-web.entrypoints=web"
      - "traefik.http.services.gymapp-web.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-net"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      ASSETS_URL: ${ASSETS_URL:-https://assets-gymapp.elautomata.com/exercises}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: 3001
    networks:
      - proxy-net
      - devaai_services-prod
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gymapp-api.rule=Host(`api-gymapp.elautomata.com`)"
      - "traefik.http.routers.gymapp-api.entrypoints=web"
      - "traefik.http.services.gymapp-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy-net"

  assets:
    build:
      context: ./assets
      dockerfile: Dockerfile
    volumes:
      - ./assets/exercises:/usr/share/nginx/html/exercises:ro
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gymapp-assets.rule=Host(`assets-gymapp.elautomata.com`)"
      - "traefik.http.routers.gymapp-assets.entrypoints=web"
      - "traefik.http.services.gymapp-assets.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-net"

  backup:
    image: postgres:16-alpine
    container_name: gymapp-backup
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      BACKUP_DAYS: "7"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "while true; do /backup.sh; sleep 86400; done"
    networks:
      - devaai_services-prod
    restart: unless-stopped

networks:
  proxy-net:
    external: true
  devaai_services-prod:
    external: true

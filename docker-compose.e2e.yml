services:
  postgres:
    image: postgres:16-alpine
    container_name: gymapp_e2e_postgres
    environment:
      POSTGRES_USER: gymapp_e2e
      POSTGRES_PASSWORD: gymapp_e2e
      POSTGRES_DB: gymapp_e2e
    volumes:
      - gymapp_e2e_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymapp_e2e -d gymapp_e2e"]
      interval: 2s
      timeout: 3s
      retries: 10

  assets:
    build:
      context: ./assets
      dockerfile: Dockerfile
    container_name: gymapp_e2e_assets
    volumes:
      - ./assets/exercises:/usr/share/nginx/html/exercises:ro
    ports:
      - "5174:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/exercises/index.html >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  gymapp_e2e_postgres_data:
